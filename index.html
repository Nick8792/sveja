  // ============================================================
  // 12. UTILS
  // ============================================================
  function animateNumber(el, from, to, duration) {
    if (!el) return;
    const start = performance.now();
    function step(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      el.textContent = Math.round(from + (to - from) * eased);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ============================================================
  // showToast — notifica fugace in basso (3.2s, auto-dismiss)
  // ----------------------------------------------------------------
  // Posizione: in basso, centrato, sopra la safe-area del device.
  // Usa env(safe-area-inset-bottom) per rispettare:
  //   - iOS: home indicator (iPhone X+)
  //   - Android: gesture bar e/o nav bar
  // Su browser senza safe-area inset, il fallback è 1.5rem.
  // ============================================================
  function showToast(message, type = 'fiato') {
    // Rimuovo eventuali toast precedenti per evitare sovrapposizioni
    document.querySelectorAll('.sveja-toast').forEach(t => t.remove());

    const accent = {
      fiato:       { border: '#c9a961', icon: '⏱️' },
      ocio:        { border: '#8B0000', icon: '👁️' },
      celebration: { border: '#c9a961', icon: '✨' },
    }[type] || { border: '#c9a961', icon: '✦' };

    const toast = document.createElement('div');
    toast.className = 'sveja-toast fixed left-1/2 -translate-x-1/2 z-[150] ' +
                      'max-w-sm w-[calc(100%-2rem)] bg-sveja-card ' +
                      'rounded-sm px-4 py-3 flex items-start gap-3';
    // Posizione: 1.5rem sopra la safe-area di sistema (iOS home indicator,
    // Android gesture bar). max() garantisce minimo di 1.5rem anche su
    // browser/device che non supportano env() o non hanno safe-area.
    toast.style.bottom = 'max(1.5rem, calc(env(safe-area-inset-bottom) + 1.5rem))';
    toast.style.borderLeft = `3px solid ${accent.border}`;
    toast.style.boxShadow = '0 -8px 32px rgba(0,0,0,0.6)';
    toast.style.animation = 'toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both';
    toast.innerHTML = `
      <span class="text-xl leading-none flex-shrink-0" aria-hidden="true">${accent.icon}</span>
      <p class="text-sm text-sveja-ink leading-relaxed">${message}</p>
    `;
    document.body.appendChild(toast);

    // Auto-dismiss dopo 3.2s con fade-out + slide-down
    setTimeout(() => {
      toast.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      toast.style.opacity = '0';
      toast.style.transform = 'translate(-50%, 10px)';
      setTimeout(() => toast.remove(), 400);
    }, 3200);
  }

  // Modalità dev: si attiva con ?dev nell'URL.
  // In dev mode appare un mini-pannello in basso a destra con tre azioni:
  //   1. Reset    → svuota tutta la cronologia e il livello max
  //   2. Streak 2 → simula 3 giorni consecutivi (livello 1 — Bonus Fiato)
  //   3. Streak 5 → simula 6 giorni consecutivi (livello 2 — Ocio Furbo)
  const isDevMode = new URLSearchParams(location.search).has('dev');

  function resetAndReload() {
    if (!confirm('Reset di Sveja!? Verrà cancellato lo storico delle partite.')) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(MAX_LEVEL_KEY);
      localStorage.removeItem(LAST_NOTIFIED_KEY);
      localStorage.removeItem(ONBOARDED_KEY);
      localStorage.removeItem(CELEBRATED_STREAK_KEY);
    } catch (e) {}
    trackEvent('dev_reset', {});
    location.reload();
  }

  // ============================================================
  // simulateStreak — popola la cronologia con N giorni consecutivi
  // a partire da IERI (così oggi è "non giocato" e la streak viene
  // mostrata nell'intro come visibile/giocabile).
  //
  // Parametri:
  //   daysCount      — numero di giorni consecutivi (giorno 1..N indietro)
  //   priorMaxLevel  — livello massimo da considerare già raggiunto in
  //                    passato (per testare "riconquiste"). Se 0 (default)
  //                    azzera lo storico → comportamento "primo sblocco".
  //   suppressBanner — se true, setta lastNotified = livello attuale così
  //                    il banner bonus NON appare (utile per testare il
  //                    pulse streak in isolamento, senza interferenze).
  // ============================================================
  function simulateStreak(daysCount, priorMaxLevel = 0, suppressBanner = false) {
    const history = {};
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // Popolo a partire da ieri (i = 1) per i giorni richiesti
    for (let i = 1; i <= daysCount; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      history[dateKey(d)] = {
        score:      50,
        titoloKey:  'oste',
        titoloName: 'Oste di Piazza',
        correct:    2,
        rankPct:    55,
        ts:         d.getTime(),
      };
    }

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      // Pulisco la celebrazione del giorno: in dev mode voglio sempre
      // vedere il pulse partire quando simulo una streak, anche se in
      // una sessione precedente avevo già "celebrato" oggi.
      localStorage.removeItem(CELEBRATED_STREAK_KEY);

      // Calcolo il livello bonus che risulterà dalla streak appena creata
      const futureBonusLevel = bonusLevelFromStreak(daysCount);

      // Configuro il "passato" simulato:
      //   priorMaxLevel = livello max già raggiunto in passato
      //   lastNotified  = dipende dal flag suppressBanner
      //
      // - suppressBanner = false (default):
      //     lastNotified = priorMaxLevel
      //     → se livello attuale > priorMaxLevel: banner di SBLOCCO o RICONQUISTA
      //     → se livello attuale = priorMaxLevel: nessun banner
      //
      // - suppressBanner = true (per test pulse isolato):
      //     lastNotified = futureBonusLevel
      //     → mai banner, indipendentemente da priorMaxLevel
      if (priorMaxLevel > 0) {
        localStorage.setItem(MAX_LEVEL_KEY, String(priorMaxLevel));
        const lastNotified = suppressBanner ? futureBonusLevel : 0;
        localStorage.setItem(LAST_NOTIFIED_KEY, String(lastNotified));
      } else {
        localStorage.removeItem(MAX_LEVEL_KEY);
        if (suppressBanner) {
          localStorage.setItem(LAST_NOTIFIED_KEY, String(futureBonusLevel));
        } else {
          localStorage.removeItem(LAST_NOTIFIED_KEY);
        }
      }
    } catch (e) {}

    trackEvent('dev_simulate_streak', {
      days: daysCount,
      prior_max: priorMaxLevel,
      suppress_banner: suppressBanner,
    });
    location.reload();
  }

  // Wire-up: chiamato dopo ogni render per (ri)agganciare i listener
  function wireDevReset() {
    // === Toggle apri/chiudi del pannello dev ===
    // Trigger ⚙ in basso a destra. Click → mostra pannello + backdrop.
    // Click su X o backdrop → chiude.
    const $toggle = document.getElementById('btn-dev-toggle');
    const $panel = document.getElementById('dev-panel');
    const $backdrop = document.getElementById('dev-backdrop');
    const $close = document.getElementById('btn-dev-close');

    function openDevPanel() {
      $panel.classList.remove('hidden');
      $backdrop.classList.remove('hidden');
    }
    function closeDevPanel() {
      $panel.classList.add('hidden');
      $backdrop.classList.add('hidden');
    }

    if ($toggle) $toggle.addEventListener('click', () => {
      const isOpen = !$panel.classList.contains('hidden');
      if (isOpen) closeDevPanel();
      else openDevPanel();
    });
    if ($close) $close.addEventListener('click', closeDevPanel);
    if ($backdrop) $backdrop.addEventListener('click', closeDevPanel);

    // === Comandi del pannello ===
    const $reset = document.getElementById('btn-dev-reset');
    if ($reset) $reset.addEventListener('click', resetAndReload);

    // Sblocchi (priorMaxLevel = 0 → primo sblocco)
    const $l1 = document.getElementById('btn-dev-streak-l1');
    if ($l1) $l1.addEventListener('click', () => simulateStreak(3, 0));

    const $l2 = document.getElementById('btn-dev-streak-l2');
    if ($l2) $l2.addEventListener('click', () => simulateStreak(6, 0));

    // Riconquiste (priorMaxLevel = livello già raggiunto in passato)
    const $r1 = document.getElementById('btn-dev-reconquer-l1');
    if ($r1) $r1.addEventListener('click', () => simulateStreak(3, 1));

    const $r2 = document.getElementById('btn-dev-reconquer-l2');
    if ($r2) $r2.addEventListener('click', () => simulateStreak(6, 2));

    // === PULSE STREAK — test delle 3 intensità ===
    // Ogni bottone simula la streak esatta della soglia, così
    // checkStreakCelebration() ne rileva una valida e avvia il pulse.
    // suppressBanner: true → nessun banner bonus appare insieme al pulse,
    // così possiamo isolarne visivamente il comportamento.
    //
    //   soft   → streak 2  → pulse oro tenue
    //   strong → streak 5  → pulse oro più ampio + scale
    //   red    → streak 10 → pulse rosso Treviso drammatico
    const $ps = document.getElementById('btn-dev-pulse-soft');
    if ($ps) $ps.addEventListener('click', () => simulateStreak(2, 1, true));

    const $pst = document.getElementById('btn-dev-pulse-strong');
    if ($pst) $pst.addEventListener('click', () => simulateStreak(5, 2, true));

    const $pr = document.getElementById('btn-dev-pulse-red');
    if ($pr) $pr.addEventListener('click', () => simulateStreak(10, 2, true));

    // === SUNDAY BONUS — toggle modalità domenica ===
    // Il bottone è un toggle: cambia colore/testo a seconda dello stato.
    // Quando attivo, isSundayBonusActive() restituisce sempre true,
    // anche se non è effettivamente domenica.
    const $sun = document.getElementById('btn-dev-sunday');
    if ($sun) {
      // Aggiorno l'aspetto in base allo stato corrente
      const updateSundayBtn = () => {
        if (devForceSunday) {
          $sun.textContent = '☀️ Domenica ATTIVA';
          $sun.classList.add('bg-sveja-gold/20', 'border-sveja-gold');
          $sun.classList.remove('bg-sveja-elev');
        } else {
          $sun.textContent = '☀️ Forza Domenica';
          $sun.classList.remove('bg-sveja-gold/20', 'border-sveja-gold');
          $sun.classList.add('bg-sveja-elev');
        }
      };
      updateSundayBtn();
      $sun.addEventListener('click', () => {
        devForceSunday = !devForceSunday;
        trackEvent('dev_force_sunday', { active: devForceSunday });
        updateSundayBtn();
      });
    }

    // === Test diretto della schermata Proverbio ===
    // Salta tutto il flusso del quiz e lancia direttamente la 4ª schermata
    // con il proverbio della settimana corrente. Utile per iterare
    // rapidamente sull'estetica della schermata bonus.
    const $tp = document.getElementById('btn-dev-test-proverb');
    if ($tp) $tp.addEventListener('click', () => {
      // Chiudo il pannello dev se aperto
      const $panel = document.getElementById('dev-panel');
      const $bd = document.getElementById('dev-backdrop');
      if ($panel) $panel.classList.add('hidden');
      if ($bd) $bd.classList.add('hidden');
      // Lancio direttamente la schermata bonus
      enterSundayBonus();
    });
  }

          sizes: "192x192", type: "image/svg+xml", purpose: "any maskable",
        },
        {
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a0a0a'/%3E%3Ctext x='256' y='350' font-family='Georgia,serif' font-size='310' font-weight='bold' text-anchor='middle' fill='%238B0000' font-style='italic'%3ES%3C/text%3E%3C/svg%3E",
          sizes: "512x512", type: "image/svg+xml", purpose: "any maskable",
        },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    document.getElementById('manifest-link').setAttribute('href', URL.createObjectURL(blob));

    // Service Worker stub (cache di base) — per produzione usa un sw.js statico
    if ('serviceWorker' in navigator) {
      const swCode = `
        const C='sveja-v1';
        self.addEventListener('install',e=>self.skipWaiting());
        self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch',e=>{
          e.respondWith(caches.open(C).then(c=>c.match(e.request).then(r=>{
            const f=fetch(e.request).then(res=>{
              if(res&&res.status===200&&e.request.method==='GET')c.put(e.request,res.clone());
              return res;
            }).catch(()=>r);
            return r||f;
          })));
        });`;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }
  })();

  // ============================================================
  // 14. BOOTSTRAP — decide la schermata iniziale
  // ============================================================
  function bootstrap() {
    // Se in dev mode, inietto il pannello UNA SOLA VOLTA all'avvio.
    // Vive fuori dall'$app container, così non viene distrutto/ricreato
    // dai render delle schermate. Questo evita bug iOS Safari sui tap
    // persi quando un elemento fixed viene aggiunto al DOM in continuazione.
    if (isDevMode) {
      document.body.insertAdjacentHTML('beforeend', devResetButton());
      wireDevReset();
    }

    const todayResult = storage.getToday();

    // === SISTEMA BONUS EVOLUTIVO ===
    // calculateStreak() restituisce i giorni consecutivi giocati,
    // partendo da OGGI se giocato, altrimenti da IERI.
    state.streak = calculateStreak();
    state.bonusLevel = bonusLevelFromStreak(state.streak);

    // ============================================================
    // LOGICA DI NOTIFICA — basata su due dati persistiti:
    //
    // 1. lastNotified = ultimo livello per cui è stato mostrato un toast
    //    (aggiornato ogni volta che il toast viene effettivamente visto)
    // 2. maxEver = livello massimo mai raggiunto nella vita
    //    (aggiornato monotonicamente, non si resetta mai)
    //
    // Notifico solo se il livello attuale è SUPERIORE all'ultimo notificato.
    // Se è la PRIMA volta a quel livello (maxEver < bonusLevel) → 'unlock-X'
    // Se ci ero già stato in passato                            → 'reconquer-X'
    // ============================================================
    const lastNotified = getLastNotifiedLevel();
    const maxEver = getMaxLevelEverReached();

    state.bonusEvent = null;
    if (state.bonusLevel > lastNotified) {
      // Transizione verso un livello più alto rispetto all'ultima notifica
      if (state.bonusLevel === 1) {
        state.bonusEvent = (maxEver < 1) ? 'unlock-l1' : 'reconquer-l1';
      } else if (state.bonusLevel === 2) {
        state.bonusEvent = (maxEver < 2) ? 'unlock-l2' : 'reconquer-l2';
      }
    } else if (state.bonusLevel < lastNotified) {
      // L'utente è SCESO di livello (ha perso la streak).
      // Allineo lastNotified al livello attuale: in questo modo, quando
      // riconquisterà il livello superiore in futuro, scatterà di nuovo
      // un toast di "riconquista".
      setLastNotifiedLevel(state.bonusLevel);
    }

    // Aggiorno il livello max storico se ho raggiunto un nuovo apice
    if (state.bonusLevel > maxEver) {
      setMaxLevelEverReached(state.bonusLevel);
    }

    if (todayResult) {
      // ha già giocato oggi → schermata locked (niente toast bonus)
      state.bonusEvent = null;
      // Ripristino lo stato del proverbio dallo storico, così se
      // l'utente ricarica e va a vedere lo share/locked, il badge
      // continua a essere mostrato correttamente.
      if (todayResult.proverbCorrect) {
        state.sundayBonus.correct = true;
      }
      navigate('locked');
    } else if (!isOnboarded()) {
      // primo accesso assoluto → mostro l'onboarding prima dell'intro
      // Nota: l'onboarding ha priorità anche sul banner bonus pendente,
      // perché l'utente che apre per la prima volta non ha ancora costruito
      // alcuno streak (bonusLevel sarà sempre 0).
      navigate('onboarding');
    } else {
      navigate('intro');
    }
  }

  document.addEventListener('DOMContentLoaded', bootstrap);
  </script>
