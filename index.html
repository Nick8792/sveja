<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Sveja! — Tre prove, sessanta secondi. Il quiz d'intuito alla veneta." />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Sveja! — Quiz Veneto</title>

  <!-- ============================================================
       PWA — Manifest & Apple meta
       ============================================================ -->
  <link rel="manifest" id="manifest-link" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sveja!" />

  <!-- Favicon inline SVG -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='60' font-weight='bold' text-anchor='middle' fill='%238B0000' font-style='italic'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='60' font-weight='bold' text-anchor='middle' fill='%238B0000' font-style='italic'%3ES%3C/text%3E%3C/svg%3E" />

  <!-- ============================================================
       FONTS — Cormorant Garamond (display) + Space Grotesk (body)
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- ============================================================
       TAILWIND CDN (MVP) + Configurazione personalizzata
       ============================================================ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Configurazione Tailwind: colori del brand, tipografia,
       animazioni custom. Tutto centralizzato qui per coerenza. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Palette brand "Sveja!"
            'rosso-treviso': {
              DEFAULT: '#8B0000',  // Rosso Treviso ufficiale
              glow:    '#B22222',  // Variante hover/glow
              deep:    '#5C0000',  // Ombra profonda
            },
            'sveja': {
              bg:        '#0a0a0a',  // Background principale
              card:      '#141414',  // Card / superficie elevata 1
              elev:      '#1c1c1c',  // Superficie elevata 2 (hover)
              border:    'rgba(245, 241, 232, 0.08)',
              ink:       '#f5f1e8',  // Testo primario (off-white caldo)
              'ink-muted': '#a8a196', // Testo secondario
              gold:      '#c9a961',  // Accento dorato (titoli ironici)
            },
            'feedback': {
              correct:   '#4ade80',
              warn:      '#fbbf24',
              alert:     '#f97316',
              wrong:     '#dc2626',
            },
          },
          fontFamily: {
            // Display: editoriale, italico, con grazie — stile veneto
            display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            // Sans: moderna, geometrica — equilibra il display
            sans:    ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono:    ['ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          fontSize: {
            'logo':    ['4.5rem', { lineHeight: '1.15', letterSpacing: '-0.02em' }],
            'logo-lg': ['6rem',   { lineHeight: '1.15', letterSpacing: '-0.02em' }],
          },
          letterSpacing: {
            'wider-2':  '0.2em',
            'widest-2': '0.3em',
          },
          boxShadow: {
            'rosso-sm': '0 4px 24px rgba(139, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1)',
            'rosso-md': '0 6px 32px rgba(139, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.15)',
            'whatsapp': '0 4px 24px rgba(37, 211, 102, 0.3)',
          },
          animation: {
            'fade-up':      'fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) both',
            'fade-up-fast': 'fadeUp 0.25s cubic-bezier(0.4, 0, 0.2, 1) both',
            'fade-in':      'fadeIn 0.4s ease both',
            'score':        'scoreReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both',
            'shake':        'shake 0.4s ease',
            'pulse-rosso':  'pulseRosso 2s infinite',
            'explain-in':   'explainIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both',
          },
          keyframes: {
            fadeUp: {
              '0%':   { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%':   { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scoreReveal: {
              '0%':   { opacity: '0', transform: 'scale(0.5)' },
              '50%':  { transform: 'scale(1.1)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%':      { transform: 'translateX(-4px)' },
              '75%':      { transform: 'translateX(4px)' },
            },
            pulseRosso: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(139, 0, 0, 0.4)' },
              '50%':      { boxShadow: '0 0 0 12px rgba(139, 0, 0, 0)' },
            },
            // Ingresso del box spiegazione: slide-up + scale leggera
            // per dare presenza senza essere aggressivo
            explainIn: {
              '0%':   { opacity: '0', transform: 'translateY(20px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
            },
          },
        },
      },
    };
  </script>

  <!-- ============================================================
       Stili Tailwind custom (componenti riutilizzabili)
       ============================================================ -->
  <style type="text/tailwindcss">
    @layer base {
      html, body {
        @apply bg-sveja-bg text-sveja-ink font-sans antialiased;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar { width: 0; }
    }

    @layer components {
      /* Logo "Sveja!" — typographic identity */
      .logo-sveja {
        @apply font-display italic font-bold tracking-tight;
        background: linear-gradient(180deg, #f5f1e8 0%, #d4cdb8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 40px rgba(139, 0, 0, 0.3);
        /* Padding bottom per non tagliare il descender della "j" del Cormorant */
        padding-bottom: 0.15em;
      }
      .logo-bang {
        @apply text-rosso-treviso;
        -webkit-text-fill-color: #8B0000;
        text-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
      }

      /* Divider ornamentale — stile veneto */
      .divider-ornate {
        @apply flex items-center gap-3 text-rosso-treviso;
      }
      .divider-ornate::before,
      .divider-ornate::after {
        content: '';
        @apply flex-1 h-px;
        background: linear-gradient(90deg, transparent, #8B0000, transparent);
      }

      /* Eyebrow / numerazione editoriale */
      .eyebrow {
        @apply font-display italic text-sveja-gold text-xs uppercase tracking-widest-2;
      }

      /* Bottone primario */
      .btn-primary {
        @apply bg-rosso-treviso text-sveja-ink font-semibold uppercase
               tracking-wider text-sm py-5 rounded-sm
               shadow-rosso-sm transition-all duration-200;
      }
      .btn-primary:hover,
      .btn-primary:active {
        @apply bg-rosso-treviso-glow shadow-rosso-md;
        transform: translateY(-1px);
      }

      /* Bottone WhatsApp */
      .btn-whatsapp {
        @apply bg-[#25D366] text-sveja-bg font-bold tracking-wide
               py-5 rounded-sm shadow-whatsapp
               flex items-center justify-center gap-3
               transition-all duration-200;
      }
      .btn-whatsapp:hover,
      .btn-whatsapp:active {
        @apply bg-[#2eed73];
        transform: translateY(-1px);
      }

      /* Bottone secondario / ghost */
      .btn-ghost {
        @apply bg-sveja-card text-sveja-ink-muted font-medium tracking-wide
               text-sm py-4 rounded-sm border border-sveja-border
               transition-all duration-200;
      }
      .btn-ghost:hover,
      .btn-ghost:active {
        @apply bg-sveja-elev text-sveja-ink;
      }

      /* Card opzione risposta */
      .answer-btn {
        @apply relative w-full text-left px-5 py-3 rounded-sm
               bg-sveja-card border border-sveja-border
               flex items-center gap-4 overflow-hidden
               transition-all duration-200;
      }
      .answer-btn::before {
        content: '';
        @apply absolute left-0 top-0 bottom-0 w-[3px] bg-rosso-treviso;
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.3s ease;
      }
      .answer-btn:hover::before,
      .answer-btn:active::before { transform: scaleY(1); }
      .answer-btn:hover,
      .answer-btn:active {
        @apply bg-sveja-elev;
        border-color: rgba(139, 0, 0, 0.4);
        transform: translateX(2px);
      }
      .answer-btn.is-correct {
        background: rgba(74, 222, 128, 0.08);
        border-color: rgba(74, 222, 128, 0.4);
      }
      .answer-btn.is-correct::before {
        @apply bg-feedback-correct;
        transform: scaleY(1);
      }
      .answer-btn.is-wrong {
        background: rgba(220, 38, 38, 0.12);
        border-color: rgba(220, 38, 38, 0.5);
      }
      .answer-btn.is-wrong::before {
        @apply bg-feedback-wrong;
        transform: scaleY(1);
      }
      .answer-btn:disabled { cursor: not-allowed; }

      /* Lettera dell'opzione */
      .answer-letter {
        @apply font-display italic font-bold text-2xl text-rosso-treviso w-6 flex-shrink-0;
      }

      /* Timer bar */
      .timer-track {
        @apply w-full h-1.5 bg-white/5 rounded-full overflow-hidden;
      }
      .timer-fill {
        @apply h-full rounded-full;
        background: var(--timer-color, #4ade80);
        box-shadow: 0 0 12px var(--timer-color, #4ade80);
        transition: background 0.3s ease, box-shadow 0.3s ease, width 0.1s linear;
      }
      /* Stato urgente: pulse + glow per aumentare la pressione sotto i 5s */
      .timer-fill.timer-urgent {
        animation: timerPulse 0.6s ease-in-out infinite;
      }
      @keyframes timerPulse {
        0%, 100% {
          opacity: 1;
          box-shadow: 0 0 12px var(--timer-color, #dc2626);
        }
        50% {
          opacity: 0.55;
          box-shadow: 0 0 24px var(--timer-color, #dc2626),
                      0 0 4px var(--timer-color, #dc2626);
        }
      }

      /* Anello del punteggio */
      .score-ring {
        background: conic-gradient(
          from -90deg,
          #8B0000 0%,
          #8B0000 var(--score-pct, 0%),
          rgba(255,255,255,0.06) var(--score-pct, 0%),
          rgba(255,255,255,0.06) 100%
        );
      }

      /* Box spiegazione */
      .explain-box {
        @apply bg-sveja-card border-l-2 border-sveja-gold rounded-sm p-4 mt-4;
      }
    }

    @layer utilities {
      /* Keyframe per i toast del bonus (entrata dal basso, coerente con la posizione) */
      @keyframes toastIn {
        0%   { opacity: 0; transform: translate(-50%, 20px); }
        100% { opacity: 1; transform: translate(-50%, 0); }
      }

      /* Altezza viewport "small" per mobile: usa la dimensione minima
         garantita (toolbar visibile) per evitare scroll su iOS/Android.
         Fallback a 100vh per browser non recenti. */
      .h-screen-mobile {
        min-height: 100vh; /* fallback */
        min-height: 100svh;
      }

      /* Padding verticale ridotto: usato sulla schermata quiz per
         massimizzare lo spazio utile su mobile. */
      .py-quiz {
        padding-top: 1rem;    /* 16px */
        padding-bottom: 1rem;
      }
    }

    @layer utilities {
      /* Pattern di sfondo veneto (radiali soft) */
      .bg-veneto {
        background-image:
          radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(201, 169, 97, 0.05) 0%, transparent 40%);
      }

      /* Texture grain overlay (atmosfera) */
      .grain-overlay::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Vignetta radiale per profondità */
      .grain-overlay::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      }

      /* Numeri tabulari per timer / punteggi */
      .tabular { font-variant-numeric: tabular-nums; }
    }
  </style>

  <!-- ============================================================
       CSS PURO — regole non interpretate da Tailwind CDN.
       Ospitate qui le regole che agiscono su classi aggiunte
       dinamicamente via JS (is-eliminated) o stati che Tailwind
       potrebbe non emettere correttamente nel suo layer.
       ============================================================ -->
  <style>
    /* Stato "eliminato" applicato dal Bonus Ocio Furbo (livello 2):
       spegne visivamente la risposta sbagliata.
       In dark mode l'opacity da sola non basta (il nero "vince"),
       quindi cambio direttamente i colori del testo e del bordo.
       La lettera resta rossa ma con opacità ridotta, per mantenere
       l'identità visiva del brand. */
    .answer-btn.is-eliminated {
      pointer-events: none !important;
      border-color: rgba(245, 241, 232, 0.04) !important;
      background-color: rgba(20, 20, 20, 0.4) !important;
    }
    /* Testo della risposta: grigio scuro */
    .answer-btn.is-eliminated > span:not(.answer-letter) {
      color: #4a4641 !important;
    }
    /* Lettera A./B./C.: resta rossa ma opacizzata per coerenza brand */
    .answer-btn.is-eliminated .answer-letter {
      opacity: 0.35 !important;
    }

    /* Pallini di paginazione dell'onboarding */
    .onboarding-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background-color: rgba(245, 241, 232, 0.2);
      transition: all 0.3s ease;
    }
    .onboarding-dot.is-active {
      width: 24px;
      background-color: #c9a961; /* sveja-gold */
    }

    /* Compensazione ottica del letter-spacing per testi centrati:
       tracking-widest-2 (0.3em) aggiunge spazio DOPO l'ultima lettera ma
       non PRIMA della prima → in text-align:center il baricentro si sposta
       a destra. Aggiungo padding-left dello stesso valore per centrare
       otticamente il testo. */
    .eyebrow {
      padding-left: 0.3em !important;
    }

    /* Box streak nell'intro: piccolo "passport" del progresso utente.
       Fondo card scuro, bordo sottile dorato, testo dorato.
       Font Space Grotesk (font-mono) per i numeri e la label,
       per differenziarli dal Cormorant del titolo. */
    .streak-box {
      background-color: rgba(20, 20, 20, 0.5);
      border: 1px solid rgba(201, 169, 97, 0.25);
      border-radius: 2px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .streak-label {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #c9a961;
      text-transform: uppercase;
    }

    /* ============================================================
       STREAK PULSE — celebrazione visiva alle soglie significative
       ----------------------------------------------------------------
       3 intensità in base alla soglia raggiunta (vedi getStreakPulseClass):
         - soft   → 2gg              : pulse oro tenue
         - strong → 5gg, 7gg         : pulse oro più ampio + scale
         - red    → 10, 20, 30, 50, 100 : pulse rosso Treviso, più drammatico
       Tutte le animazioni sono FINITE (4 iterazioni, ~3s totali).
       Una volta esaurite, il box torna allo stato statico definito sopra.
       ============================================================ */
    @keyframes streakPulseSoft {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(201, 169, 97, 0.5);
        border-color: rgba(201, 169, 97, 0.25);
      }
      50% {
        box-shadow: 0 0 16px 4px rgba(201, 169, 97, 0.4);
        border-color: rgba(201, 169, 97, 0.7);
      }
    }
    @keyframes streakPulseStrong {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(201, 169, 97, 0.6);
        border-color: rgba(201, 169, 97, 0.4);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 28px 8px rgba(201, 169, 97, 0.55);
        border-color: rgba(201, 169, 97, 0.95);
        transform: scale(1.025);
      }
    }
    @keyframes streakPulseRed {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(139, 0, 0, 0.7);
        border-color: rgba(139, 0, 0, 0.5);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 36px 10px rgba(139, 0, 0, 0.65),
                    0 0 8px 2px rgba(178, 34, 34, 0.5);
        border-color: rgba(178, 34, 34, 1);
        transform: scale(1.035);
      }
    }
    .streak-pulse-soft {
      animation: streakPulseSoft 0.8s ease-in-out 4;
    }
    .streak-pulse-strong {
      animation: streakPulseStrong 0.85s ease-in-out 4;
    }
    .streak-pulse-red {
      animation: streakPulseRed 0.9s ease-in-out 4;
    }
    /* Quando il pulse è "red", la label cambia colore per coerenza */
    .streak-pulse-red .streak-label {
      color: #B22222;
      transition: color 0.4s ease;
    }

    /* ============================================================
       SUNDAY BONUS — schermata "Il Proverbio del Vecio"
       ----------------------------------------------------------------
       Sfondo dorato sottile per distinguere visivamente il momento
       contemplativo dal quiz adrenalinico. Più caldo, più calmo.
       L'overlay viene applicato al body quando la schermata è attiva
       (classe `is-sunday-bonus` aggiunta dinamicamente da renderSundayBonus).
       ============================================================ */
    body.is-sunday-bonus {
      background-image:
        radial-gradient(circle at 30% 20%, rgba(201, 169, 97, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(201, 169, 97, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.05) 0%, transparent 40%);
      transition: background-image 0.6s ease;
    }

    /* Box spiegazione del proverbio: variante del .explain-box,
       con bordo dorato più marcato e padding più ampio (è il
       momento "contemplativo" della giornata). */
    .proverb-explain-box {
      background-color: rgba(20, 20, 20, 0.7);
      border-left: 3px solid #c9a961;
      border-radius: 2px;
      padding: 1.25rem;
      margin-top: 1rem;
    }

    /* ============================================================
       BONUS FLASH — etichetta "+X velocità" sotto il timer
       ----------------------------------------------------------------
       Quando l'utente risponde correttamente e ha guadagnato un bonus
       velocità, mostriamo per ~1.8s un'etichetta dorata SOTTO il numero
       del timer. È sticky con l'header, quindi resta visibile anche se
       l'utente guarda il box spiegazione in mezzo allo schermo.
       L'animazione: slide-down da -8px a 0 + fade-in/out morbido.
       ============================================================ */
    .bonus-flash {
      position: absolute;
      top: 100%;          /* sotto il numero "12s" */
      right: 0;           /* allineato a destra come il timer */
      margin-top: 4px;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c9a961;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      animation: bonusFlash 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-shadow: 0 0 12px rgba(201, 169, 97, 0.5);
    }
    @keyframes bonusFlash {
      0%   { opacity: 0; transform: translateY(-8px); }
      15%  { opacity: 1; transform: translateY(0); }
      75%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(2px); }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center bg-veneto grain-overlay">

  <!-- ============================================================
       APP CONTAINER — mobile-first, max-width contenuto
       Le schermate vengono iniettate qui dinamicamente dal router JS
       ============================================================ -->
  <main id="app" class="w-full max-w-md mx-auto min-h-screen flex flex-col px-6 py-10">
    <!-- render dinamico -->
  </main>

  <script>
  /* ============================================================================
     SVEJA! — Motore di gioco
     ----------------------------------------------------------------------------
     Architettura:
       1. contentConfig  → tutti i testi (UI, titoli, messaggi, share)
       2. quizDB         → database 7 giorni di quiz con spiegazioni
       3. storage        → persistenza localStorage (1 partita/giorno)
       4. analytics      → trackEvent in console
       5. router         → SPA: intro / quiz / results / locked
       6. game engine    → timer, scoring, bonus, hint
     ============================================================================ */

  // ============================================================
  // 1. CONTENT CONFIG — testi separati per traduzione futura
  // ============================================================
  const contentConfig = {
    meta: {
      appName:  "Sveja!",
      tagline:  "Tre domande, trenta secondi. Vediamo se te sì svejo, vecio!",
      appUrl:   "https://sveja.app",
      newQuizHour: 7, // ora del giorno (locale) in cui si sblocca il nuovo quiz
    },

    // ============================================================
    // ONBOARDING — visualizzato solo alla prima apertura.
    // 3 schermate sequenziali per introdurre il gioco e i bonus.
    // I testi sono pensati come "traducibili" per future versioni
    // regionali (lombardo, napoletano, ecc.): nessun riferimento
    // hardcoded a Treviso fuori dal field "city".
    // ============================================================
    onboarding: {
      skip: "Salta",
      next: "Avanti →",
      back: "← Indietro",
      done: "Son pronto",
      city: "Treviso",
      slides: [

  const STORAGE_KEY = 'sveja_play_history_v1';

  const storage = {
    // Restituisce la cronologia: { 'YYYY-MM-DD': { score, titoloKey, titoloName, correct } }
    read() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        console.warn('[Sveja!] localStorage non disponibile, modalità ospite');
        return {};
      }
    },
    write(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
      catch (e) { /* private mode, silent */ }
    },
    saveResult(score, titoloKey, titoloName, correctCount, rankPct, proverbCorrect) {
      const history = this.read();
      history[dateKey(new Date())] = {
        score, titoloKey, titoloName, correct: correctCount,
        rankPct: rankPct ?? null,
        // Badge "Conoscitore di proverbi" — solo la domenica.
        // null se non era domenica, true/false se era domenica.
        proverbCorrect: proverbCorrect ?? null,
        ts: Date.now(),
      };
      this.write(history);
    },
    // Aggiorna solo il campo proverbCorrect del risultato di oggi.
    // Chiamato dopo la risposta al proverbio della domenica, perché
    // il salvataggio iniziale (finalizeQuiz) avviene PRIMA del bonus.
    updateProverbResult(proverbCorrect) {
      const history = this.read();
      const todayKey = dateKey(new Date());
      if (history[todayKey]) {
        history[todayKey].proverbCorrect = proverbCorrect;
        this.write(history);
      }
    },
    getToday() {
      return this.read()[dateKey(new Date())] || null;
    },
    getYesterday() {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      return this.read()[dateKey(y)] || null;
    },
  };

  // Format data come 'YYYY-MM-DD' in timezone locale
  function dateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // Calcola il prossimo "07:00 locale"
  function nextUnlockTime() {
    const now = new Date();
    const unlock = new Date(now);
    unlock.setHours(contentConfig.meta.newQuizHour, 0, 0, 0);
    if (unlock <= now) unlock.setDate(unlock.getDate() + 1);
    return unlock;
  }

  // Index del quiz odierno (0..6)
  function getTodayQuizIndex() {
    const epoch = Math.floor(Date.now() / 86400000);
    return epoch % quizDB.length;
  }

  // Verifica se oggi è domenica (getDay: 0=domenica, 1=lunedì, ...).
  // Esiste anche un override per testing in dev mode, settato dal
  // bottone "☀️ Domenica" del pannello dev. Quando attivo, forza
  // il bonus domenica indipendentemente dal giorno reale.
  let devForceSunday = false;
  function isSundayBonusActive() {
    if (devForceSunday) return true;
    return new Date().getDay() === 0;
  }

  // Calcola la settimana ISO dell'anno corrente (1..53).
  // Algoritmo standard: prendiamo il giovedì della settimana corrente
  // (per gestire l'edge case del cambio anno) e contiamo quanti giorni
  // sono passati dal 1° gennaio.
  function getISOWeek(date = new Date()) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    // ISO: giorno della settimana, lunedì=1, domenica=7
    const dayNum = d.getUTCDay() || 7;
    // Sposto al giovedì della settimana corrente
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    // Inizio anno
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    // Numero di settimana = quante settimane intere dal 1° gennaio
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  // Restituisce l'indice del proverbio della settimana corrente.
  // Rotazione fissa: ogni domenica della stessa settimana ISO mostra
  // sempre lo stesso proverbio. Quando si arriva alla fine della
  // lista, ricomincia dal primo (modulo).
  function getTodayProverbIndex() {
    return getISOWeek() % proverbsDB.length;
  }

  // Restituisce il proverbio del giorno (oggetto completo).
  function getTodayProverb() {
    return proverbsDB[getTodayProverbIndex()];
  }

  // ============================================================
  // SHUFFLE — mescola le opzioni di una domanda
  // ----------------------------------------------------------------
  // Riceve una domanda e restituisce una NUOVA domanda con le
  // opzioni mescolate casualmente. Aggiorna automaticamente
  // l'indice della risposta corretta in base alla nuova posizione.
  //
  // Algoritmo: Fisher-Yates shuffle (gold standard, distribuzione uniforme).
  // ============================================================
  function shuffleQuestionOptions(question) {
    // Creo array di indici originali [0, 1, 2, ...] e li mescolo
    const indices = question.opzioni.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    // Costruisco la nuova domanda con opzioni nell'ordine mescolato
    const newOpzioni = indices.map(i => question.opzioni[i]);
    // La nuova posizione della risposta corretta è dove finisce
    // l'indice originale corretto nella permutazione
    const newCorrectIdx = indices.indexOf(question.risposta_corretta);
    // Restituisco una copia (no mutation della domanda originale nel quizDB)
    return {
      ...question,
      opzioni: newOpzioni,
      risposta_corretta: newCorrectIdx,
    };
  }

  // ============================================================
  // STREAK — calcolo giorni consecutivi giocati
  // ----------------------------------------------------------------
  // Scorre la cronologia all'indietro a partire da OGGI (se giocato)
  // o da IERI (se non ancora giocato oggi). Conta i giorni consecutivi.
  // Esempio: oggi non giocato, ieri sì, l'altro ieri sì, 3 giorni fa NO
  //   → streak = 2
  // ============================================================
  function calculateStreak() {
    const history = storage.read();
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // Decido da dove partire: se oggi non c'è ancora una partita,
    // parto da ieri (la streak è quella che l'utente sta per "spendere"
    // entrando oggi, ma viene mostrata nell'intro PRIMA di giocare)
    let cursor = new Date(today);
    if (!history[dateKey(cursor)]) {
      cursor.setDate(cursor.getDate() - 1);
    }

    let streak = 0;
    while (history[dateKey(cursor)]) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
      // Limite di sicurezza per evitare loop infiniti (max 365 giorni)
      if (streak > 365) break;
    }
    return streak;
  }

  // Determina il livello del bonus in base alla streak
  //   streak < 2     → 0 (nessun bonus)
  //   streak 2-4     → 1 (Bonus Fiato)
  //   streak >= 5    → 2 (Ocio Furbo)
  function bonusLevelFromStreak(streak) {
    if (streak >= 5) return 2;
    if (streak >= 2) return 1;
    return 0;
  }

  // Persistenza del livello massimo mai raggiunto (per detectare "primo giorno
  // di livello 2"). Usa una chiave dedicata, indipendente dalla cronologia partite.
  const MAX_LEVEL_KEY = 'sveja_max_bonus_level_v1';

  // Persistenza dell'ULTIMO livello bonus per cui è stato già mostrato un toast.
  // Serve a detectare le "transizioni di livello" tra una sessione e l'altra:
  // se oggi entro con bonusLevel = 1 e l'ultima notifica era 0, devo mostrare il toast.
  // Se l'ultima notifica era già 1 (continuità), niente toast.
  const LAST_NOTIFIED_KEY = 'sveja_last_notified_level_v1';

  // Persistenza dell'onboarding completato.
  // Una volta che l'utente ha visto l'introduzione (anche skippata),
  // non viene mai più mostrata.
  const ONBOARDED_KEY = 'sveja_onboarded_v1';

  // Persistenza della celebrazione streak già mostrata oggi.
  // Salva la data (YYYY-MM-DD) dell'ultimo giorno in cui abbiamo mostrato
  // il pulse di celebrazione. Se l'utente apre l'app più volte nello stesso
  // giorno, il pulse parte solo la prima volta.
  const CELEBRATED_STREAK_KEY = 'sveja_celebrated_streak_v1';

  function getMaxLevelEverReached() {
    try { return parseInt(localStorage.getItem(MAX_LEVEL_KEY) || '0', 10); }
    catch (e) { return 0; }
  }
  function setMaxLevelEverReached(level) {
    try { localStorage.setItem(MAX_LEVEL_KEY, String(level)); }
    catch (e) { /* private mode */ }
  }
  function getLastNotifiedLevel() {
    try { return parseInt(localStorage.getItem(LAST_NOTIFIED_KEY) || '0', 10); }
    catch (e) { return 0; }
  }
  function setLastNotifiedLevel(level) {
    try { localStorage.setItem(LAST_NOTIFIED_KEY, String(level)); }
    catch (e) { /* private mode */ }
  }

  function isOnboarded() {
    try { return localStorage.getItem(ONBOARDED_KEY) === 'true'; }
    catch (e) { return false; }
  }
  function setOnboarded() {
    try { localStorage.setItem(ONBOARDED_KEY, 'true'); }
    catch (e) { /* private mode */ }
  }

  // Helper per la celebrazione streak: legge/scrive la data dell'ultima
  // celebrazione mostrata. Restituisce null se mai mostrata.
  function getCelebratedStreakDate() {
    try { return localStorage.getItem(CELEBRATED_STREAK_KEY); }
    catch (e) { return null; }
  }
  function setCelebratedStreakDate(dateStr) {
    try { localStorage.setItem(CELEBRATED_STREAK_KEY, dateStr); }
    catch (e) { /* private mode */ }
  }

  // ============================================================
  // getStreakPulseClass — mappa la streak alla classe CSS del pulse
  // ----------------------------------------------------------------
  // Ritorna null se la streak NON è una soglia significativa (niente pulse).
  // Soglie e intensità:
  //   2, 3       → 'streak-pulse-soft'   (pulse oro tenue, gratificazione iniziale)
  //   5, 7       → 'streak-pulse-strong' (pulse oro più ampio + scale)
  //   10, 20,
  //   30, 50,100 → 'streak-pulse-red'    (pulse rosso Treviso, drammatico)
  //
  // Tutte le altre streak (4, 6, 8, 9, 11..19, ecc.) → null
  //
  // Nota: 2 e 3 sono entrambi "soft" perché nei primi giorni l'utente
  // ha bisogno di feedback frequente per consolidare l'abitudine.
  // Da 4 in poi il ritmo si rarefà — solo soglie "memorabili".
  // ============================================================
  function getStreakPulseClass(streak) {
    if (streak === 2 || streak === 3)          return 'streak-pulse-soft';
    if (streak === 5 || streak === 7)          return 'streak-pulse-strong';
    if ([10, 20, 30, 50, 100].includes(streak)) return 'streak-pulse-red';
    return null;
  }

  // ============================================================
  // 4. ANALYTICS — tracking eventi
  // ============================================================
  function trackEvent(eventName, payload = {}) {
    const stamp = new Date().toISOString();
    console.log(
      `%c[Sveja! analytics] %c${eventName}`,
      'color:#8B0000;font-weight:bold;',
      'color:#c9a961;font-weight:bold;',
      { time: stamp, ...payload }
    );
  }

  // ============================================================
  // 5. STATE & ROUTER
  // ============================================================
  const state = {
    screen:       'intro',          // 'intro' | 'quiz' | 'results' | 'locked'
    questions:    [],               // domande del giorno
    currentIdx:   0,
    correctCount: 0,
    totalSeconds: 30,               // timer globale 30s (ricalibrato per ritmo adrenalinico)
    graceSeconds: 7,                // periodo di grazia per domanda (bonus pieno)
    remaining:    30,
    startTime:    0,                // ms — inizio quiz
    questionStartTime: 0,           // ms — inizio domanda corrente
    timerId:      null,
    finalScore:   0,
    finalTitolo:  null,
    finalRank:    null,             // percentuale di ranking simulata (social proof)
    breakdown:    { base: 0, bonus: 0 },
    speedBonus:   0,                // accumulatore bonus velocità per domanda
    lastQuestionBonus: 0,           // bonus dell'ultima risposta (per UI feedback)
    wasTimeout:   false,            // true se i risultati arrivano da timeout
    // === BONUS EVOLUTIVO ===
    streak:        0,               // giorni consecutivi (calcolato in bootstrap)
    bonusLevel:    0,               // 0 = nessuno, 1 = Fiato, 2 = Ocio Furbo
    bonusUsed:     false,           // se è già stato usato in questa partita
    // Toast event di transizione:
    //   null            → nessun toast (livello invariato o livello 0)
    //   'unlock-l1'     → primo sblocco livello 1
    //   'reconquer-l1'  → riconquista livello 1
    //   'unlock-l2'     → primo sblocco livello 2
    //   'reconquer-l2'  → riconquista livello 2
    bonusEvent:    null,
    // Indice della slide corrente nell'onboarding (0..2)
    onboardingSlide: 0,
    awaitingNext:  false, // mentre mostra spiegazione
    // === SUNDAY BONUS — "Il Proverbio del Vecio" ===
    // Si attiva la domenica (o con override dev). Stato dedicato per
    // non interferire con il flusso principale del quiz.
    sundayBonus: {
      active:   false, // true durante la visualizzazione della 4ª schermata
      proverb:  null,  // oggetto proverbio dal proverbsDB
      answered: false, // l'utente ha già selezionato una risposta
      correct:  false, // se ha indovinato (usato per il badge nei risultati)
    },
  };

  const $app = document.getElementById('app');

  function navigate(screen) {
    state.screen = screen;
    render();
  }

  function render() {
    // Pulisco timer se cambio schermata mentre era attivo
    if (state.screen !== 'quiz' && state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }

    // Pulisco lo sfondo dorato del Sunday Bonus se siamo cambiati
    // di schermata. Garantisce che la classe non resti attaccata
    // al body se si arriva ai risultati o al locked direttamente.
    if (state.screen !== 'sundayBonus') {
      document.body.classList.remove('is-sunday-bonus');
    }

    // Reset delle classi modificatore: le schermate che usano il layout
    // mobile-friendly (intro, quiz, locked, onboarding) le applicano
    // nei loro renderer. Solo results torna al padding standard.
    if (state.screen === 'results') {
      $app.classList.remove('h-screen-mobile', 'py-quiz');
      $app.classList.add('py-10');
    }

    const renderer = {
      onboarding:  renderOnboarding,
      intro:       renderIntro,
      quiz:        renderQuiz,
      sundayBonus: renderSundayBonus,
      results:     renderResults,
      locked:      renderLocked,
    }[state.screen];

    if (renderer) renderer();

    window.scrollTo(0, 0);
  }

  // ============================================================
  // 5b. RENDER — ONBOARDING (3 slide al primo accesso)
  // ============================================================
  function renderOnboarding() {
    const c = contentConfig.onboarding;
    const slide = c.slides[state.onboardingSlide];
    const isLast = state.onboardingSlide === c.slides.length - 1;

    // Stesso layout mobile-friendly di intro
    $app.classList.add('h-screen-mobile', 'py-quiz');
    $app.classList.remove('py-10');

    // Distinguo il PRIMO render (apertura onboarding) dai successivi
    // (cambio slide). Al primo applico le animazioni scaglionate per
    // dare l'effetto "entrata cinematografica". Ai cambi di slide
    // tolgo i delay così la transizione è immediata e percepita come fluida.
    const isFirstRender = !state.onboardingRendered;
    state.onboardingRendered = true;

    // Helper: applica una fade animation a tutti gli elementi.
    //   - Primo render → 'animate-fade-up' (0.5s con delay scaglionati)
    //     per dare un effetto "entrata cinematografica"
    //   - Cambi slide  → 'animate-fade-up-fast' (0.25s, niente delay)
    //     per una transizione morbida ma reattiva
    const fadeUp = isFirstRender ? 'animate-fade-up' : 'animate-fade-up-fast';
    // Helper: genera lo style con animation-delay solo al primo render
    const delay = isFirstRender ? (s) => `animation-delay:${s}s` : () => '';

    // Costruisco i puntini di paginazione
    const dotsHtml = c.slides.map((_, i) => {
      const active = i === state.onboardingSlide;
      return `<span class="onboarding-dot${active ? ' is-active' : ''}"></span>`;
    }).join('');

    // Body può contenere \n per andare a capo (es. lista bonus della slide 3)
    const bodyHtml = (slide.body || '').replace(/\n/g, '<br>');

    $app.innerHTML = `
      <section class="flex-1 flex flex-col text-center" data-slide="${state.onboardingSlide}">

        <!-- Header con "Salta" in alto a destra -->
        <header class="flex justify-between items-center mb-6 ${isFirstRender ? 'animate-fade-in' : ''}">
          <span class="logo-sveja text-xl">Sveja<span class="logo-bang">!</span></span>
          <button id="btn-skip-onboarding"
                  class="text-[10px] uppercase tracking-widest-2 text-sveja-ink-muted
                         px-3 py-2 transition-opacity hover:opacity-70">
            ${c.skip}
          </button>
        </header>

        <!-- Contenuto centrato verticalmente -->
        <div class="flex-1 flex flex-col items-center justify-center">
          <p class="eyebrow mb-4 ${fadeUp}">${slide.eyebrow}</p>
          <h2 class="font-display italic text-5xl md:text-6xl mb-4 ${fadeUp}"
              style="${delay(0.1)}">${slide.title}</h2>
          ${slide.subtitle ? `
            <p class="font-display italic text-lg text-sveja-gold mb-6 ${fadeUp}"
               style="${delay(0.15)}">${slide.subtitle}</p>
          ` : ''}
          <p class="text-base text-sveja-ink leading-relaxed px-2 ${fadeUp}"
             style="${delay(0.2)}">${bodyHtml}</p>
        </div>

        <!-- Paginazione: pallini -->
        <div class="flex justify-center gap-2 mb-4 ${fadeUp}"
             ${isFirstRender ? `style="${delay(0.3)}"` : ''}>
          ${dotsHtml}
        </div>

        <!-- Bottone "Indietro": solo dalla slide 2 in poi -->
        ${state.onboardingSlide > 0 ? `
          <button id="btn-onboarding-back"
                  class="text-[11px] uppercase tracking-widest-2 text-sveja-ink-muted
                         px-3 py-2 mb-2 self-center transition-opacity hover:opacity-70">
            ${c.back}
          </button>
        ` : ''}

        <!-- Bottone primary -->
        <button id="btn-onboarding-next"
                class="btn-primary w-full ${fadeUp}"
                ${isFirstRender ? `style="${delay(0.35)}"` : ''}>
          ${isLast ? c.done : c.next}
        </button>
      </section>
    `;

    // Wire events
    document.getElementById('btn-onboarding-next').addEventListener('click', () => {
      if (isLast) {
        completeOnboarding();
      } else {
        state.onboardingSlide++;
        render();
      }
    });
    document.getElementById('btn-skip-onboarding').addEventListener('click', completeOnboarding);

    // Bottone indietro: solo se esiste (dalla slide 2 in poi)
    const $back = document.getElementById('btn-onboarding-back');
    if ($back) {
      $back.addEventListener('click', () => {
        if (state.onboardingSlide > 0) {
          state.onboardingSlide--;
          render();
        }
      });
    }
  }

  // Termina l'onboarding: persisti che è stato visto e vai all'intro
  function completeOnboarding() {
    setOnboarded();
    trackEvent('onboarding_completed', {
      slide_reached: state.onboardingSlide,
      skipped: state.onboardingSlide < contentConfig.onboarding.slides.length - 1,
    });
    state.onboardingSlide = 0;        // reset slide per eventuali future visualizzazioni
    state.onboardingRendered = false; // reset flag animazioni

    // Consumo eventuali banner bonus pendenti: l'onboarding ha appena
    // spiegato il sistema dei bonus, quindi sarebbe ridondante mostrare
    // subito dopo "Bonus 2 sbloccato!" nell'intro. Persisto il livello
    // attuale come "già notificato" — esattamente come farebbe il click
    // su "Dai che 'ndemo" dell'intro normale.
    if (state.bonusEvent) {
      setLastNotifiedLevel(state.bonusLevel);
      state.bonusEvent = null;
    }

    navigate('intro');
  }

  // ============================================================
  // 6. RENDER — INTRO
  // ============================================================
  function renderIntro() {
    const c = contentConfig.intro;
    const cb = contentConfig.quiz.bonus;

    // Applico classi modificatore al main per la schermata intro:
    // - h-screen-mobile: usa 100svh per evitare scroll su mobile
    // - py-quiz: padding compatto, stesso pattern della schermata quiz
    $app.classList.add('h-screen-mobile', 'py-quiz');
    $app.classList.remove('py-10');

    // === BANNER BONUS ===
    // Mostrato solo se c'è una transizione di livello da segnalare
    // (sblocco o riconquista). Resta visibile fino al click su "start"
    // e poi viene "consumato" persistendo lastNotifiedLevel.
    let bonusBannerHtml = '';
    if (state.bonusEvent) {
      let message, borderColor, icon;
      switch (state.bonusEvent) {

          icon = cb.level1.icon;

        case 'reconquer-l1':
          message = cb.level1.reconquered;
          borderColor = '#c9a961';
          icon = cb.level1.icon;
          break;
        case 'unlock-l2':
          message = cb.level2.unlocked;
          borderColor = '#8B0000'; // rosso-treviso
          icon = cb.level2.icon;
          break;
        case 'reconquer-l2':
          message = cb.level2.reconquered;
          borderColor = '#8B0000';
          icon = cb.level2.icon;
          break;
      }
      if (message) {
        bonusBannerHtml = `
          <div class="w-full bg-sveja-card rounded-sm p-4 mb-6 animate-fade-up flex items-start gap-3"
               style="animation-delay:0.18s; border-left: 2px solid ${borderColor};">
            <span class="text-xl leading-none flex-shrink-0 mt-0.5" aria-hidden="true">${icon}</span>
            <p class="text-sm text-sveja-ink leading-relaxed text-left">${message}</p>
          </div>
        `;
      }
    }

    // === BOX STREAK ===
    // Mostrato solo se streak >= 2 (un solo giorno non è una serie).
    // Posizionato sopra al banner bonus, sotto il divisore ornamentale.
    let streakBoxHtml = '';
    if (state.streak >= 2) {
      const label = c.streakLabel.replace('{n}', state.streak);
      streakBoxHtml = `
        <div id="streak-box"
             class="streak-box w-full mb-6 animate-fade-up"
             style="animation-delay:0.16s">
          <span class="streak-label">${label}</span>
        </div>
      `;
    }

    $app.innerHTML = `
      <section class="flex-1 flex flex-col items-center justify-center text-center">
        <p class="eyebrow mb-3 animate-fade-up">${c.eyebrow}</p>

        <h1 class="logo-sveja text-logo md:text-logo-lg mb-2 animate-fade-up">
          Sveja<span class="logo-bang">!</span>
        </h1>
        <p class="font-display italic text-lg text-sveja-ink-muted mb-6 animate-fade-up"
           style="animation-delay:0.1s">
          ${contentConfig.meta.tagline}
        </p>

        <div class="divider-ornate w-full mb-6 animate-fade-up" style="animation-delay:0.15s">
          <span class="text-xs">✦</span>
        </div>

        ${streakBoxHtml}

        ${bonusBannerHtml}

        <div class="space-y-4 mb-6 text-left w-full animate-fade-up" style="animation-delay:0.2s">
          ${c.rules.map((rule, i) => `
            <div class="flex gap-4 items-start">
              <span class="font-display italic font-bold text-2xl text-rosso-treviso leading-none w-6 flex-shrink-0">
                ${['I.', 'II.', 'III.'][i]}
              </span>
              <p class="text-sm text-sveja-ink-muted leading-relaxed">${rule}</p>
            </div>
          `).join('')}
        </div>

        <button id="btn-start"
                class="btn-primary w-full animate-fade-up animate-pulse-rosso"
                style="animation-delay:0.3s">
          ${c.startButton}
        </button>

        <p class="text-[10px] text-sveja-ink-muted mt-4 tracking-widest-2 uppercase animate-fade-up"
           style="animation-delay:0.35s">
          ${c.footer}
        </p>
      </section>
    `;

    document.getElementById('btn-start').addEventListener('click', startQuiz);

    // Celebrazione streak: applica il pulse se la soglia è significativa
    // e non è ancora stata celebrata oggi.
    checkStreakCelebration();
  }

  // ============================================================
  // checkStreakCelebration — applica il pulse al box streak
  // ----------------------------------------------------------------
  // Si attiva solo se TUTTE le condizioni sono vere:
  //   1. il box streak esiste nel DOM (streak >= 2)
  //   2. la streak attuale è una soglia significativa
  //   3. non abbiamo già celebrato oggi (CELEBRATED_STREAK_KEY)
  //
  // IMPORTANTE: il box ha già l'animazione 'animate-fade-up' di entrata
  // (durata 0.5s, delay 0.16s). Per evitare conflitti CSS sulla proprietà
  // shorthand `animation`, aspettiamo che il fade-up sia COMPLETAMENTE
  // finito (delay + durata = ~700ms) prima di applicare il pulse.
  // Inoltre, prima di applicare la classe pulse, RIMUOVIAMO la classe
  // animate-fade-up così la nuova animazione non si scontra con la
  // precedente (anche se finita, alcuni browser mantengono lo stato).
  // ============================================================
  function checkStreakCelebration() {
    const $box = document.getElementById('streak-box');
    if (!$box) return; // nessun box streak in pagina (streak < 2)

    const pulseClass = getStreakPulseClass(state.streak);
    if (!pulseClass) return; // streak non in lista soglie → niente pulse

    const today = dateKey(new Date());
    if (getCelebratedStreakDate() === today) return; // già celebrato oggi

    // Aspetto che il fade-up di entrata sia completato (0.16s delay + 0.5s
    // duration = 660ms) e poi un piccolo buffer (40ms) per sicurezza.
    setTimeout(() => {
      // Rimuovo la classe del fade-up così non c'è sovrapposizione
      // sulla proprietà shorthand `animation`. Il box è già visibile
      // a questo punto, quindi rimuoverla non ha effetti visivi.
      $box.classList.remove('animate-fade-up');
      // Forzo un reflow del browser così la prossima aggiunta di classe
      // viene riconosciuta come una "nuova" animazione e parte davvero.
      void $box.offsetWidth;
      // Applico la classe pulse
      $box.classList.add(pulseClass);
    }, 700);

    setCelebratedStreakDate(today);
    trackEvent('streak_celebrated', { streak: state.streak, intensity: pulseClass });
  }

  // ============================================================
  // 7. RENDER — QUIZ

  function renderQuiz() {

  // ============================================================
  // BONUS BUTTON — render del CTA in alto a destra del quiz
  // ----------------------------------------------------------------
  // Stile: bordo dorato (sveja-gold) per il livello 1, rosso Treviso
  // per il livello 2 (più "premium"). Usa Space Grotesk maiuscolo.
  // ============================================================
  function renderBonusButton() {

    const borderColor = lvl === 2
      ? 'border-rosso-treviso/50 hover:bg-rosso-treviso/10'
      : 'border-sveja-gold/50 hover:bg-sveja-gold/10';

    return `

              class="font-sans text-[11px] uppercase tracking-wider font-semibold

                     rounded-sm px-3 py-1.5 transition-all duration-200
                     flex items-center gap-1.5 flex-shrink-0

  // ============================================================

  // ----------------------------------------------------------------
  // Si attiva con state.screen === 'sundayBonus'.

  // ============================================================
  // handleProverbAnswer — gestisce la risposta al proverbio
  // ----------------------------------------------------------------
  // A differenza di handleAnswer del quiz standard, qui:
  //   - non c'è timer da fermare
  //   - non si calcola bonus velocità
  //   - la risposta corretta/sbagliata serve solo per il badge nei risultati
  // ============================================================
  function handleProverbAnswer(idx, btn) {
    if (state.sundayBonus.answered) return;
    state.sundayBonus.answered = true;

    const proverb = state.sundayBonus.proverb;
    const isCorrect = idx === proverb.risposta_corretta;
    state.sundayBonus.correct = isCorrect;

    // Disabilito tutti i bottoni
    document.querySelectorAll('#proverb-answers .answer-btn').forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add('is-correct');
    } else {
      btn.classList.add('is-wrong', 'animate-shake');
      // Evidenzio la corretta
      const correctBtn = document.querySelector(
        `#proverb-answers .answer-btn[data-idx="${proverb.risposta_corretta}"]`
      );
      if (correctBtn) correctBtn.classList.add('is-correct');
    }

    trackEvent('proverb_answered', {
      proverb_idx: getTodayProverbIndex(),
      correct: isCorrect,
      proverb_tipo: proverb.tipo,
    });

    // Aggiorno lo storico di oggi col risultato del proverbio.
    // Lo faccio QUI (dopo la risposta) perché finalizeQuiz ha già
    // salvato il record di oggi PRIMA che l'utente entrasse nel bonus.
    storage.updateProverbResult(isCorrect);

    showProverbExplanation(isCorrect);
  }

  // ============================================================
  // showProverbExplanation — mostra la spiegazione del proverbio
  // ----------------------------------------------------------------
  // Tono didattico-affettivo, sempre presente (sia se giusta che
  // sbagliata). Il bottone finale chiude il bonus e va ai risultati.
  // ============================================================
  function showProverbExplanation(isCorrect) {
    const c = contentConfig.sundayBonus;
    const proverb = state.sundayBonus.proverb;
    const feedbackLabel = isCorrect ? c.feedbackCorrect : c.feedbackWrong;

    const $explain = document.getElementById('proverb-explain');
    $explain.classList.remove('hidden');
    $explain.innerHTML = `
      <div class="proverb-explain-box animate-explain-in">
        <p class="eyebrow mb-3">${feedbackLabel}</p>
        <p class="text-sm text-sveja-ink leading-relaxed mb-5">${proverb.spiegazione}</p>
        <button id="btn-proverb-exit" class="btn-primary w-full font-bold tracking-wider">
          ${c.exitButton}
        </button>
      </div>
    `;

    document.getElementById('btn-proverb-exit').addEventListener('click', exitSundayBonus);
  }

  // ============================================================
  // exitSundayBonus — chiude la schermata bonus e va ai risultati
  // ----------------------------------------------------------------
  // Rimuove la classe dal body (per resettare lo sfondo) e naviga.
  // ============================================================
  function exitSundayBonus() {
    document.body.classList.remove('is-sunday-bonus');
    state.sundayBonus.active = false;
    navigate('results');
  }

  // ============================================================
  // enterSundayBonus — entra nella schermata bonus
  // ----------------------------------------------------------------
  // Inizializza lo stato del bonus e attiva la schermata. Chiamata
  // dal flusso principale quando isSundayBonusActive() è true.
  //
  // Le opzioni del proverbio vengono mescolate con shuffleQuestionOptions
  // (la stessa usata per le 3 domande standard), così la posizione
  // della risposta corretta cambia ogni domenica e l'utente non può
  // imparare un pattern fisso (es. "è sempre la B").
  // ============================================================
  function enterSundayBonus() {
    state.sundayBonus.active = true;
    state.sundayBonus.proverb = shuffleQuestionOptions(getTodayProverb());
    state.sundayBonus.answered = false;
    state.sundayBonus.correct = false;

    trackEvent('sunday_bonus_enter', {
      proverb_idx: getTodayProverbIndex(),
      proverb_tipo: state.sundayBonus.proverb.tipo,
    });

    navigate('sundayBonus');
  }

  // ============================================================
  // showBonusFlash — etichetta "+X velocità" sotto il timer
  // ----------------------------------------------------------------
  // Mostra brevemente (~1.8s) una piccola etichetta dorata sotto
  // il numero del timer per dare feedback visivo del bonus velocità
  // appena guadagnato. Si auto-rimuove al termine dell'animazione.
  //
  // Chiamata DOPO il calcolo del bonus in handleAnswer, solo se
  // qBonus >= 1 (sotto questa soglia non vale la pena, vedi edge case).
  // ============================================================
  function showBonusFlash(amount) {
    const $slot = document.getElementById('bonus-flash-slot');
    if (!$slot) return;
    // Pulizia: se per qualche motivo c'è già un flash attivo, lo rimuovo
    $slot.innerHTML = '';
    // Creo l'etichetta con animazione CSS auto-eseguita
    const label = document.createElement('span');
    label.className = 'bonus-flash';
    label.textContent = `+${amount} velocità`;
    $slot.appendChild(label);
    // Auto-rimozione dopo l'animazione (1.8s + buffer)
    setTimeout(() => {
      if (label.parentElement) label.remove();
    }, 2000);
  }
  function startQuiz() {
    const todayQuiz = quizDB[getTodayQuizIndex()];
    // Mischio l'ordine delle risposte per ogni domanda, aggiornando
    // l'indice della risposta corretta. Così la posizione cambia ogni
    // partita e nessuno può "ricordare" che la giusta è sempre la B.
    state.questions    = todayQuiz.questions.map(shuffleQuestionOptions);
    state.currentIdx   = 0;
    state.correctCount = 0;
    state.remaining    = state.totalSeconds;
    state.startTime    = Date.now();
    state.questionStartTime = Date.now();   // timestamp inizio prima domanda
    state.speedBonus   = 0;                 // accumulatore bonus velocità
    state.lastQuestionBonus = 0;            // reset bonus per UI feedback
    state.wasTimeout   = false;             // reset flag timeout
    state.bonusUsed    = false;             // reset bonus per la nuova partita
    state.awaitingNext = false;

    // Se l'utente aveva un evento bonus pendente (banner mostrato nell'intro),
    // ora che ha effettivamente avviato il quiz consideriamo la notifica "consumata":
    // persisto il livello attuale così al prossimo refresh il banner non riapparirà.
    if (state.bonusEvent) {
      setLastNotifiedLevel(state.bonusLevel);
      state.bonusEvent = null;
    }

    trackEvent('quiz_start', {
      day_index:   todayQuiz.day,
      streak:      state.streak,
      bonus_level: state.bonusLevel,
    });

    navigate('quiz');
    startTimer();
  }

  // Timer con gestione pausa: l'utente legge la spiegazione → tempo congelato.
  // pauseAccum accumula i ms sospesi; il calcolo del rimanente li sottrae.
  let pauseAccum = 0;
  let pauseStart = 0;

  function pauseTimer() {
    if (state.awaitingNext) return;
    state.awaitingNext = true;
    pauseStart = Date.now();
  }
  function resumeTimer() {
    if (!state.awaitingNext) return;
    pauseAccum += Date.now() - pauseStart;
    state.awaitingNext = false;
  }

  function startTimer() {
    pauseAccum = 0;
    pauseStart = 0;
    if (state.timerId) clearInterval(state.timerId);
    state.timerId = setInterval(() => {
      if (state.awaitingNext) return;
      const elapsed = (Date.now() - state.startTime - pauseAccum) / 1000;
      state.remaining = Math.max(0, state.totalSeconds - elapsed);
      updateTimerUI();
      if (state.remaining <= 0) {
        clearInterval(state.timerId);
        state.timerId = null;
        // Anche con timeout, la domenica passiamo dal proverbio.
        // Mostriamo l'overlay drammatico, poi entriamo nel bonus
        // invece di andare ai risultati.
        if (isSundayBonusActive()) {
          finalizeQuiz(true);
          showTimeoutOverlay();
          setTimeout(() => {
            const overlay = document.getElementById('timeout-overlay');
            if (overlay) {
              overlay.style.transition = 'opacity 0.7s ease';
              overlay.style.opacity = '0';
              setTimeout(() => overlay.remove(), 700);
            }
            enterSundayBonus();
          }, 1000);
        } else {
          endQuiz(true);
        }
      }
    }, 100);
  }

  function updateTimerUI() {
    const fill = document.getElementById('timer-fill');
    const display = document.getElementById('timer-display');
    if (!fill || !display) return;

    const pct = (state.remaining / state.totalSeconds) * 100;
    fill.style.width = pct + '%';

    // Soglie colore basate sui SECONDI assoluti:
    //   > 20s        : verde
    //   20 → 10s     : arancione
    //   < 10s        : rosso + pulse (urgenza visiva)
    let color;
    if (state.remaining > 20)      color = '#4ade80'; // verde
    else if (state.remaining > 10) color = '#f97316'; // arancione
    else                           color = '#dc2626'; // rosso
    fill.style.setProperty('--timer-color', color);

    // Pulse di urgenza sotto i 10 secondi
    if (state.remaining <= 10) fill.classList.add('timer-urgent');
    else fill.classList.remove('timer-urgent');

    display.textContent = Math.ceil(state.remaining);

    // Anche il numero diventa rosso urgente sotto i 10s, per coerenza visiva
    if (state.remaining <= 10) display.classList.add('text-feedback-wrong', 'font-bold');
    else display.classList.remove('text-feedback-wrong', 'font-bold');
  }

  // ============================================================
  // useBonus — applica l'effetto del bonus in base al livello
  // ----------------------------------------------------------------
  // L1 (Fiato):     +5 secondi al timer globale (anche se in pausa,
  //                 verrà applicato correttamente perché modifichiamo
  //                 totalSeconds + il timestamp iniziale)
  // L2 (Ocio Furbo): elimina una risposta sbagliata della domanda corrente
  //
  // Vincoli:
  //  - Massimo 1 utilizzo per partita (controllato via state.bonusUsed)
  //  - Nascosto se streak < 2 (state.bonusLevel === 0)
  //  - Compatibile con la pausa del timer durante la spiegazione
  // ============================================================
  function useBonus() {
    if (state.bonusUsed || state.bonusLevel < 1) return;
    if (state.awaitingNext) return; // se è aperta la spiegazione, ignoro

    const cb = contentConfig.quiz.bonus;
    state.bonusUsed = true;

    if (state.bonusLevel === 1) {
      // === LIVELLO 1: BONUS FIATO ===
      // Aggiungo 5 secondi al timer. Tecnicamente lo faccio aumentando
      // pauseAccum di 5 secondi: questo ha l'effetto di "regalare" 5s
      // al calcolo elapsed, indipendentemente dal fatto che il timer
      // sia in pausa o no. È più robusto di toccare totalSeconds (che
      // influenzerebbe anche le soglie colore in modo strano).
      pauseAccum += 5000;
      // Aggiorno subito il display
      const elapsed = (Date.now() - state.startTime - pauseAccum) / 1000;
      state.remaining = Math.max(0, state.totalSeconds - elapsed);
      updateTimerUI();

      showToast(cb.level1.toast, 'fiato');
      trackEvent('bonus_used', { level: 1, type: 'fiato', extra_seconds: 5 });

    } else if (state.bonusLevel === 2) {
      // === LIVELLO 2: OCIO FURBO ===
      // Elimina una risposta sbagliata SCELTA A CASO tra quelle ancora
      // disponibili (evita di eliminare sempre la prima in ordine).
      const q = state.questions[state.currentIdx];
      const btns = document.querySelectorAll('#answers .answer-btn');
      // Raccolgo gli indici delle risposte sbagliate ancora valide
      const candidates = [];
      btns.forEach(btn => {
        const idx = Number(btn.dataset.idx);
        if (idx !== q.risposta_corretta && !btn.classList.contains('is-eliminated')) {
          candidates.push(btn);
        }
      });
      // Pick casuale tra le candidate
      if (candidates.length > 0) {
        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        chosen.classList.add('is-eliminated');
      }

      showToast(cb.level2.toast, 'ocio');
      trackEvent('bonus_used', { level: 2, type: 'ocio_furbo', question_idx: state.currentIdx });
    }

    // Disabilito visivamente il bottone bonus (resta a video ma "spento")
    const $btn = document.getElementById('btn-bonus');
    if ($btn) {
      $btn.classList.add('opacity-30', 'pointer-events-none', 'grayscale');
      // Aggiorno l'etichetta a "Bonus usato"
      const labelSpan = $btn.querySelector('span:last-child');
      if (labelSpan) labelSpan.textContent = cb.usedLabel;
    }
  }

  function handleAnswer(idx, btn) {
    if (state.awaitingNext) return;

    const q = state.questions[state.currentIdx];
    const isCorrect = idx === q.risposta_corretta;

    // Disabilito tutti i bottoni
    document.querySelectorAll('#answers .answer-btn').forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add('is-correct');
      state.correctCount++;

      // ============================================================
      // CALCOLO BONUS PER DOMANDA (periodo di grazia 7s)
      // ----------------------------------------------------------------
      // Bonus massimo per domanda: 100/3 - 25 = 8.333... punti
      // (così 25 base + 8.33 bonus × 3 domande = 100 esatti, arrotondato)
      //
      // Logica:
      //   - Risposta entro 7s dalla comparsa della domanda → bonus PIENO (8.33)
      //   - Dopo i 7s → diminuzione lineare proporzionale ai SECONDI TOTALI
      //     rimanenti sul timer da 30s
      //   - Quando il timer arriva a 0 → bonus = 0
      // ============================================================
      const elapsedOnQuestion = (Date.now() - state.questionStartTime) / 1000;
      const bonusMax = 100 / 3 - 25; // 8.333...
      let qBonus;

      if (elapsedOnQuestion <= state.graceSeconds) {
        // Periodo di grazia: bonus pieno
        qBonus = bonusMax;
      } else {
        // Decadimento lineare basato sui secondi totali rimanenti
        // Frazione del tempo totale ancora disponibile (0..1)
        const remainingFrac = Math.max(0, state.remaining) / state.totalSeconds;
        qBonus = bonusMax * remainingFrac;
      }
      state.speedBonus += qBonus;

      // Feedback visivo: mostro "+X velocità" sotto il timer.
      // Arrotondo il bonus a intero per coerenza col display dei risultati.
      // Sotto 1 punto non lo mostro (vedi edge case discusso): l'utente
      // ha comunque preso i 25 base, ma una etichetta "+0" sarebbe
      // demotivante. Salviamo il numero anche per la riga nel box spiegazione.
      const qBonusRounded = Math.round(qBonus);
      if (qBonusRounded >= 1) {
        showBonusFlash(qBonusRounded);
      }
      // Memorizzo il bonus appena guadagnato per mostrarlo anche nel box
      // spiegazione (vedi showExplanation).
      state.lastQuestionBonus = qBonusRounded;
    } else {
      btn.classList.add('is-wrong', 'animate-shake');
      // evidenzio la corretta
      const correctBtn = document.querySelector(`#answers .answer-btn[data-idx="${q.risposta_corretta}"]`);
      if (correctBtn) correctBtn.classList.add('is-correct');
      // Reset del bonus per coerenza con la riga nel box spiegazione
      state.lastQuestionBonus = 0;
    }

    // Mostro la spiegazione (timer in pausa)
    pauseTimer();
    showExplanation(isCorrect, q.spiegazione);
  }

  function showExplanation(isCorrect, spiegazione) {
    const c = contentConfig.quiz;
    const reactions = isCorrect ? c.feedbackCorrect : c.feedbackWrong;
    const reaction  = reactions[Math.floor(Math.random() * reactions.length)];
    const isLast    = state.currentIdx >= state.questions.length - 1;

    // Determino il testo del bottone:
    //   - Domanda non ultima → "AVANTI VECIO ↓"
    //   - Ultima domanda (giorni feriali) → "VERDETTO FINALE ↓"
    //   - Ultima domanda (domenica) → "IL PROVERBIO DEL VECIO ↓"
    let nextButtonLabel;
    if (!isLast) {
      nextButtonLabel = c.nextHint;
    } else if (isSundayBonusActive()) {
      nextButtonLabel = contentConfig.sundayBonus.enterButton;
    } else {
      nextButtonLabel = c.lastHint;
    }

    const $explain = document.getElementById('explain');
    $explain.classList.remove('hidden');
    $explain.innerHTML = `
      <div class="explain-box animate-explain-in">
        <p class="eyebrow mb-2">
          ${isCorrect ? '✓ ' : '✕ '}${reaction}
        </p>
        ${isCorrect && state.lastQuestionBonus >= 1 ? `
          <p class="font-mono text-[11px] uppercase tracking-widest-2 text-sveja-gold mb-3"
             style="opacity:0.85;">
            +${state.lastQuestionBonus} velocità
          </p>
        ` : ''}
        <p class="text-sm text-sveja-ink leading-relaxed mb-5">${spiegazione}</p>
        <button id="btn-next" class="btn-primary w-full font-bold tracking-wider">
          ${nextButtonLabel}
        </button>
      </div>
    `;

    document.getElementById('btn-next').addEventListener('click', goNext);
  }

  function goNext() {
    state.currentIdx++;
    resumeTimer();
    if (state.currentIdx >= state.questions.length) {
      // Fine delle 3 domande standard. Decido dove andare:
      //   - Domenica → schermata bonus "Il Proverbio del Vecio"
      //   - Altri giorni → calcolo punteggio e vai ai risultati
      // Anche se è domenica, il punteggio del quiz va calcolato PRIMA
      // di entrare nel bonus, così quando l'utente uscirà dal proverbio
      // il punteggio sarà già pronto per la schermata risultati.
      if (isSundayBonusActive()) {
        finalizeQuiz(false); // calcola punteggio + salva, ma non naviga
        enterSundayBonus();
      } else {
        endQuiz(false);
      }
    } else {
      // Resetto il cronometro della singola domanda — riparte il periodo di grazia
      state.questionStartTime = Date.now();
      // ri-render della prossima domanda mantenendo timer attivo
      const remainingPct = (state.remaining / state.totalSeconds) * 100;
      renderQuiz();
      // forzo la barra al valore corretto
      const fill = document.getElementById('timer-fill');
      if (fill) fill.style.width = remainingPct + '%';
    }
  }

  // ============================================================
  // finalizeQuiz — calcola punteggio, titolo, rank e salva su storage
  // ----------------------------------------------------------------
  // Estratto da endQuiz per essere riutilizzabile: la domenica chiamiamo
  // finalizeQuiz() prima di entrare nel proverbio (così quando l'utente
  // arriverà ai risultati, il punteggio sarà già pronto). Negli altri
  // giorni endQuiz() chiama finalizeQuiz() e poi naviga.
  //
  // NOTA: questa funzione xé idempotente solo se chiamata una volta per
  // partita. Non chiamarla due volte: il salvataggio su storage fa il
  // lock della partita di oggi.
  // ============================================================
  function finalizeQuiz(timeUp) {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }

    // ============================================================
    // CALCOLO PUNTEGGIO (uguale per timeout e fine naturale)
    // ----------------------------------------------------------------
    // In caso di timeout NON azzeriamo: conservare i punti delle
    // risposte già date (base + bonus accumulati in handleAnswer).
    // L'utente è penalizzato perché non ha completato, non perché
    // viene azzerato — è una distinzione di game design importante.
    // ============================================================
    const base  = state.correctCount * 25;
    const bonus = Math.round(state.speedBonus);
    const total = Math.min(100, base + bonus);

    state.breakdown   = { base, bonus };
    state.finalScore  = total;
    state.finalTitolo = computeTitolo(total);
    state.wasTimeout  = !!timeUp;
    // Social proof: percentuale di ranking simulata
    state.finalRank   = calculateRankPercentage(total, timeUp ? 0 : state.remaining);

    // Salva risultato (impedisce di rigiocare oggi)
    storage.saveResult(
      total,
      state.finalTitolo.key,
      state.finalTitolo.name,
      state.correctCount,
      state.finalRank
    );

    // Ricalcolo la streak DOPO il salvataggio: la partita di oggi
    // ora fa parte dello storico, quindi la streak include il giorno
    // appena giocato. Senza questo aggiornamento, i risultati
    // mostrerebbero lo streak "pre-partita" (-1 rispetto al reale).
    state.streak = calculateStreak();

    trackEvent('quiz_complete', {
      score: total,
      base, bonus,
      correct: state.correctCount,
      total_questions: state.questions.length,
      titolo: state.finalTitolo.name,
      rank_pct: state.finalRank,
      time_up: timeUp,
      streak: state.streak,
      bonus_level: state.bonusLevel,
      bonus_used: state.bonusUsed,
      sunday_bonus: isSundayBonusActive(),
    });
  }

  function endQuiz(timeUp) {
    // Calcolo punteggio (se non già fatto: se siamo qui dopo il bonus
    // domenica, finalizeQuiz è già stato chiamato in goNext/timeout,
    // ma chiamarlo di nuovo richiederebbe idempotenza che non abbiamo).
    // Per ora: la chiamata da endQuiz avviene solo nei giorni feriali.
    finalizeQuiz(timeUp);

    if (timeUp) {
      // Mostra overlay "TEMPO SCADUTO!" e attendi 1s
      // prima di passare ai risultati (metabolizzazione visiva)
      showTimeoutOverlay();
      setTimeout(() => {
        const overlay = document.getElementById('timeout-overlay');
        if (overlay) {
          // Fade-out cinematografico prima della transizione (700ms)
          overlay.style.transition = 'opacity 0.7s ease';
          overlay.style.opacity = '0';
          // Rimuovo dal DOM dopo la fine del fade
          setTimeout(() => overlay.remove(), 700);
        }
        navigate('results');
      }, 1000);
    } else {
      navigate('results');
    }
  }

  function computeTitolo(score) {
    const titles = contentConfig.results.titles;
    // Ordino per soglia decrescente per garantire il match corretto
    const sorted = Object.entries(titles)
      .sort((a, b) => b[1].threshold - a[1].threshold);
    for (const [key, t] of sorted) {
      if (score >= t.threshold) return { key, ...t };
    }
    return { key: 'goto', ...titles.goto };
  }

  // ============================================================
  // SOCIAL PROOF — Algoritmo di ranking simulato
  // ----------------------------------------------------------------
  // Restituisce una percentuale verosimile in base al punteggio
  // e al tempo rimasto. Più alto è timeRemaining (entro 30s),
  // più la percentuale tende verso il limite superiore della fascia.
  //
  // Fasce:
  //   100      → 94-99%
  //   80-99    → 75-93%
  //   50-79    → 40-74%
  //   <50      → 5-39%
  //
  // Per evitare che lo stesso utente nello stesso giorno veda numeri
  // diversi (es. dopo un refresh o quando condivide), introduciamo
  // un piccolo rumore deterministico basato sulla data + score.
  // ============================================================
  function calculateRankPercentage(score, timeRemaining) {
    let min, max;
    if (score >= 100)      { min = 94; max = 99; }
    else if (score >= 80)  { min = 75; max = 93; }
    else if (score >= 50)  { min = 40; max = 74; }
    else                   { min = 5;  max = 39; }

    // Frazione del tempo rimasto (0..1) — clampata per sicurezza
    const t = Math.max(0, Math.min(1, timeRemaining / state.totalSeconds));

    // Posizione base nella fascia: chi è più veloce sale verso il max
    let pct = min + (max - min) * t;

    // Rumore deterministico: ±1.5 punti basati su seed (data + score)
    // così il numero non cambia ad ogni refresh ma sembra "naturale"
    const seed = dateKey(new Date()) + ':' + score;
    const noise = (hashSeed(seed) % 30 - 15) / 10; // -1.5 .. +1.5
    pct = Math.round(pct + noise);

    // Clamp finale ai limiti della fascia
    return Math.max(min, Math.min(max, pct));
  }

  // Hash semplice (djb2) per generare rumore deterministico dal seed
  function hashSeed(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) + h + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  function updateCountdown() {
    const $cd = document.getElementById('countdown');
    if (!$cd) {
      if (countdownId) clearInterval(countdownId);
      return;
    }
    const now = Date.now();
    const target = nextUnlockTime().getTime();
    const diff = Math.max(0, target - now);

    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    $cd.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;

    // Quando arriva il momento, ricarico la pagina per sbloccare
    if (diff <= 0) {
      clearInterval(countdownId);
      countdownId = null;
      // Piccola pausa visiva poi reload
      setTimeout(() => location.reload(), 500);
    }
  }
